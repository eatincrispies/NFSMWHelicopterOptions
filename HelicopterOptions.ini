; ============================================================================
; HelicopterOptions - MERCILESS [Veteran] PRESET
; ============================================================================
; Game: Need for Speed Most Wanted 2005
; Part of: Lethal Pursuits V3.0 - Extra Pursuit Options (EPO)
; Build style: NoProfiles / global tuning only
;
; Merciless note: the "no mercy" tier, matching the juggernaut-style heli
; tune already used in this difficulty's Bartender Helicopter.ini. Cooldown
; between strikes is almost gone, acceleration/turn response are maxed
; out within tested-safe limits, and SeeThroughWalls is ON - the chopper
; will not lose track of you just because line-of-sight breaks.
;
; HeliSheet terrain safety is STILL kept ON. Going further (forcing the
; heli to ignore terrain) is what causes wall-dives/clipping in testing,
; and that crosses from "brutal" into "broken." Everything else here is
; pushed as hard as the original author considered stable.
;
; Per the README: "Higher cop counts can affect FPS or memory on weaker
; systems." The same caution applies to a heli this persistent - if it
; starts behaving erratically, that's your sign to step down to Intense.
;
; INI basics:
;   0 = OFF / disabled
;   1 = ON / enabled
; ============================================================================

[HelicopterOptions]

; ---------------------------------------------------------------------------
; Basic logging
; ---------------------------------------------------------------------------
; LogToFile
; Vanilla value: 1
; Current value: 1
; What it does: Creates HelicopterOptions.log next to the ASI. Keep ON for release support so testers can
;               send useful logs.
; Higher usually: More logging data available for troubleshooting.
; Lower usually: No file is written; harder to diagnose issues.
; Risk / note: Leaving this ON has tiny disk I/O, but it is worth it.
LogToFile=1
; VerboseLogging
; Vanilla value: 1
; Current value: 0
; What it does: Adds full config summaries and patch-state details to the log.
; Higher usually: More detail in logs.
; Lower usually: Cleaner but less useful logs.
; Risk / note: Recommended ON while the mod is still being tested.
VerboseLogging=0

[Patches::Core]

; ---------------------------------------------------------------------------
; Main patch toggles
; ---------------------------------------------------------------------------
; EnableSkidLogicPatches
; Vanilla value: 0
; Current value: 1
; What it does: Master switch for the helicopter skid/attack logic patches.
; Higher usually: Allows skid/attack tuning below to affect gameplay.
; Lower usually: Vanilla heli attack logic.
; Risk / note: Turn this OFF if the heli starts ramming too often or acting cursed.
EnableSkidLogicPatches=1
; ForceSkidHitAttribute
; Vanilla value: 0
; Current value: 0
; What it does: Forces the heli to be allowed to use its skid-hit/ram attribute.
; Higher usually: More frequent low attack behavior.
; Lower usually: Game decides naturally if skid-hit/ram behavior is valid.
; Risk / note: OFF for release. ON can cause repeated road rams and low wall-dives.
ForceSkidHitAttribute=0
; EnableSkidEntryGatePatches
; Vanilla value: 0
; Current value: 1
; What it does: Lets the INI control the distance/direction/height gates before a skid attack starts.
; Higher usually: SkidEntry values below are used.
; Lower usually: Vanilla entry gates are used.
EnableSkidEntryGatePatches=1
; EnableSkidStrikePatches
; Vanilla value: 0
; Current value: 1
; What it does: Lets the INI control how the heli behaves once it starts a strike/ram attempt.
; Higher usually: Strike values below are used.
; Lower usually: Vanilla strike behavior is used.
EnableSkidStrikePatches=1
; EnableLeadAndHeightPatches
; Vanilla value: 0
; Current value: 1
; What it does: Lets the INI control straight-line chase lead distance and height.
; Higher usually: Lead/height values below are used.
; Lower usually: Vanilla lead/height behavior is used.
EnableLeadAndHeightPatches=1
; EnableAIVehicleVelocityPatches
; Vanilla value: 0
; Current value: 1
; What it does: Enables destination velocity helper tuning for the helicopter AI vehicle layer.
; Higher usually: Velocity tuning below affects chase response.
; Lower usually: Vanilla velocity helper behavior.
EnableAIVehicleVelocityPatches=1
; EnableAIVehicleOnDrivingDataPatches
; Vanilla value: 0
; Current value: 1
; What it does: Enables core OnDriving acceleration/speed-ratio data patches.
; Higher usually: Max/min accel and speed ratio values below are used.
; Lower usually: Vanilla OnDriving data.
EnableAIVehicleOnDrivingDataPatches=1
; EnableAIVehicleOnDrivingTurnPatches
; Vanilla value: 0
; Current value: 1
; What it does: Enables SimpleChopper turn response and turn clamp patches.
; Higher usually: Turn response and clamp below affect turning.
; Lower usually: Vanilla turn behavior.
; Risk / note: This is powerful. Too high can orbit around the player.
EnableAIVehicleOnDrivingTurnPatches=1
; EnableAIVehicleOnDrivingSmoothingPatches
; Vanilla value: 0
; Current value: 0
; What it does: Enables OnDriving smoothing constant patches.
; Higher usually: Smoothing values below would be written if enabled.
; Lower usually: Vanilla smoothing remains untouched.
; Risk / note: Keep OFF. Changing smoothing caused spin/orbit bugs in testing.
EnableAIVehicleOnDrivingSmoothingPatches=0
; ForceOnDrivingMaxSpeedCap
; Vanilla value: 0
; Current value: 0
; What it does: Optional old-style max speed cap patch. The newer [Chopper::Speed] system handles speed
;               better.
; On usually: Forces old cap behavior if supported by the build.
; Off usually: No old-style forced cap.
; Risk / note: Keep OFF unless debugging.
ForceOnDrivingMaxSpeedCap=0

[Chopper::Skid]

; ---------------------------------------------------------------------------
; Skid / ram / strike behavior
; ---------------------------------------------------------------------------
; In this mod, 'skid' means the helicopter's aggressive attack/strike setup.
; It is not tire skid. It is the heli preparing/performing a close pass or ram-style attack.

; SkidCooldownThreshold
; Vanilla value: -5.0
; Current value: -2.5
; What it does: Cooldown gate before another skid/strike can start. More negative usually spaces attacks out
;               more.
; Higher usually: Usually less frequent attacks / longer wait before next attempt.
; Lower usually: Usually more frequent attacks.
; Risk / note: If set too low, heli may feel passive. If too high, it may spam attacks.
SkidCooldownThreshold=-2.5
; SkidEntryMaxDistance
; Vanilla value: 45.0
; Current value: 62.0
; What it does: Maximum distance where the heli may begin a skid/strike attempt.
; Higher usually: Can start attacks from farther away.
; Lower usually: Must be closer before attacking.
; Risk / note: Too high can make the heli dive from odd positions.
SkidEntryMaxDistance=62.0
; SkidEntryMinDistance
; Vanilla value: 0.0
; Current value: 0.0
; What it does: Minimum distance allowed before starting skid logic.
; Higher usually: Prevents attacks when extremely close.
; Lower usually: Allows attacks even when close.
; Risk / note: Usually leave vanilla.
SkidEntryMinDistance=0.0
; SkidEntryDotRequirement
; Vanilla value: 0.55
; Current value: 0.55
; What it does: Alignment requirement before the heli can enter a strike. Higher means it must be lined up
;               better.
; Higher usually: Cleaner/straighter attack entries, fewer random dives.
; Lower usually: Looser alignment, more aggressive and more chaotic.
; Risk / note: Good stability control. Raise this if attacks look sideways/cursed.
SkidEntryDotRequirement=0.55
; SkidEntryMaxHeightDelta
; Vanilla value: 20.0
; Current value: 22.0
; What it does: Maximum vertical height difference allowed for strike entry.
; Higher usually: Allows attacks with bigger height difference.
; Lower usually: Requires closer height alignment.
; Risk / note: Lower helps avoid weird low/high dives near terrain.
SkidEntryMaxHeightDelta=22.0
; SkidSideOffset
; Vanilla value: 4.25
; Current value: 4.25
; What it does: Side offset used during skid approach positioning.
; Higher usually: Wider side approach.
; Lower usually: Closer side approach.
; Risk / note: Usually leave vanilla.
SkidSideOffset=4.25
; SkidApproachVelocityLead
; Vanilla value: 0.30
; Current value: 0.38
; What it does: How much player velocity is predicted during skid approach.
; Higher usually: Leads the player more during approach.
; Lower usually: Aims closer to current player position.
; Risk / note: Too high can make it overshoot ahead.
SkidApproachVelocityLead=0.38
; SkidApproachHeight
; Vanilla value: 1.2
; Current value: 1.4
; What it does: Height offset during the skid approach phase.
; Higher usually: Heli approaches higher / safer over roads and walls.
; Lower usually: Heli approaches lower / more intimidating.
; Risk / note: Raise if the heli clips roads/walls.
SkidApproachHeight=1.4
; SkidLowExtraHeight
; Vanilla value: 3.0
; Current value: 2.8
; What it does: Extra height added when the heli is in a low approach condition.
; Higher usually: More safety clearance when low.
; Lower usually: Lower, more aggressive low passes.
; Risk / note: Keep at or above vanilla if wall-dive happens.
SkidLowExtraHeight=2.8
; SkidStrikeStartDistance
; Vanilla value: 8.0
; Current value: 7.5
; What it does: Distance at which the actual strike portion begins.
; Higher usually: Starts strike earlier/farther out.
; Lower usually: Waits until closer before strike.
; Risk / note: Too low can make it commit late; too high can look like premature diving.
SkidStrikeStartDistance=7.5
; SkidStrikeRightDotRequirement
; Vanilla value: 0.75
; Current value: 0.65
; What it does: Alignment/direction check during strike. Usually leave stock unless testing.
; Higher usually: Stricter strike alignment.
; Lower usually: Looser strike alignment.
; Risk / note: Changing this can make strikes fail or look sideways.
SkidStrikeRightDotRequirement=0.65
; SkidStrikeVelocityLead
; Vanilla value: 0.14
; Current value: 0.16
; What it does: Player velocity prediction during the final strike.
; Higher usually: Aims farther ahead of the player.
; Lower usually: Aims more at current position.
; Risk / note: Lower helps reduce overshooting in front.
SkidStrikeVelocityLead=0.16
; SkidStrikeBackScale
; Vanilla value: -0.35
; Current value: -0.35
; What it does: Backward/behind scale applied during strike positioning.
; Higher usually: More negative can bias behind/back more.
; Lower usually: Closer to 0 reduces back offset.
; Risk / note: Usually leave vanilla.
SkidStrikeBackScale=-0.35
; SkidAbortDistanceAheadSq
; Vanilla value: 3600.0
; Current value: 3600.0
; What it does: Squared distance ahead limit for aborting a bad strike. 2500 means about 50 units.
; Higher usually: Allows strike to continue farther ahead.
; Lower usually: Aborts sooner when strike gets too far ahead.
; Risk / note: Lower helps stop overcommitted wall/forward dives.
SkidAbortDistanceAheadSq=3600.0
; SkidAbortDistanceBehindSq
; Vanilla value: 400.0
; Current value: 400.0
; What it does: Squared distance behind limit for aborting a bad strike. 225 means about 15 units.
; Higher usually: Allows more behind-distance before abort.
; Lower usually: Aborts sooner when the heli falls behind during strike.
; Risk / note: Too low can cancel attacks too easily.
SkidAbortDistanceBehindSq=400.0

[Chopper::LeadHeight]

; ---------------------------------------------------------------------------
; Straight chase lead and height
; ---------------------------------------------------------------------------
; StraightLeadSpeedScale
; Vanilla value: 0.45
; Current value: 0.45
; What it does: Speed-based lead multiplier during normal straight chase.
; Higher usually: Heli aims farther ahead as speed rises.
; Lower usually: Heli stays closer to the car instead of living far ahead.
; Risk / note: Lower this if the heli keeps getting in front of you.
StraightLeadSpeedScale=0.45
; StraightLeadBase
; Vanilla value: 35.0
; Current value: 30.0
; What it does: Base forward lead distance during chase.
; Higher usually: More forward lead.
; Lower usually: Closer/less forward lead.
; Risk / note: Too high makes the heli sit in front of the player.
StraightLeadBase=30.0
; StraightLeadMax
; Vanilla value: 60.0
; Current value: 58.0
; What it does: Maximum forward lead distance.
; Higher usually: Allows very far lead at high speed.
; Lower usually: Caps the heli closer to the player.
; Risk / note: Main anti-overshoot value.
StraightLeadMax=58.0
; StraightLeadSkidMultiplier
; Vanilla value: 0.70
; Current value: 0.70
; What it does: Multiplier applied to lead behavior when skid/attack logic is involved.
; Higher usually: More lead during attack setup.
; Lower usually: Less lead during attacks.
; Risk / note: Lower can reduce forward dives.
StraightLeadSkidMultiplier=0.70
; StraightHeightPositiveTimer
; Vanilla value: 1.5
; Current value: 1.5
; What it does: Timer/condition height value used by straight chase height logic.
; Higher usually: Can keep higher height behavior longer.
; Lower usually: Can make height transition sooner.
; Risk / note: Usually leave vanilla.
StraightHeightPositiveTimer=1.5
; StraightHeightClose
; Vanilla value: 4.5
; Current value: 4.2
; What it does: Height target when the heli is closer to the player.
; Higher usually: Flies higher while close.
; Lower usually: Flies lower while close.
; Risk / note: Raise if it gets too low near walls.
StraightHeightClose=4.2
; StraightHeightHigh
; Vanilla value: 8.0
; Current value: 8.0
; What it does: Height target for higher/farther straight chase behavior.
; Higher usually: Flies higher overall.
; Lower usually: Flies lower overall.
; Risk / note: Higher is safer but less intimidating.
StraightHeightHigh=8.0

[Chopper::Movement]

; ---------------------------------------------------------------------------
; Movement, turn, acceleration
; ---------------------------------------------------------------------------
; DestinationVelocityMultiplier
; Vanilla value: 5.5
; Current value: 8.0
; What it does: Multiplier for desired destination velocity. Controls how hard the heli tries to move toward
;               its target path.
; Higher usually: More aggressive chase and faster repositioning.
; Lower usually: Smoother/slower chase, less overshoot.
; Risk / note: Too high can push the heli in front or into walls.
DestinationVelocityMultiplier=8.0
; DestinationVelocityBlend
; Vanilla value: 0.25
; Current value: 0.36
; What it does: Blend/smoothing between old and new destination velocity.
; Higher usually: More of the new desired velocity is used.
; Lower usually: Smoother/slower changes.
; Risk / note: Too high can feel twitchy; too low can feel lazy.
DestinationVelocityBlend=0.36
; MaxChopperAccel
; Vanilla value: 80.0
; Current value: 205.0
; What it does: Maximum acceleration for the chopper movement layer.
; Higher usually: Faster catch-up and repositioning.
; Lower usually: Slower and more vanilla-like.
; Risk / note: Too high with high turn clamp can orbit or overshoot.
MaxChopperAccel=205.0
; MinChopperAccel
; Vanilla value: 30.0
; Current value: 65.0
; What it does: Minimum acceleration floor for the chopper movement layer.
; Higher usually: Keeps heli pushing harder even in low-speed cases.
; Lower usually: Lets heli settle more naturally.
; Risk / note: Do not set equal to MaxChopperAccel unless testing; that can feel forced.
MinChopperAccel=65.0
; ChopperSpeedLimitRatio
; Vanilla value: 2.0
; Current value: 3.2
; What it does: Ratio used by the AI vehicle movement speed-limit logic.
; Higher usually: Allows more chase speed headroom.
; Lower usually: Closer to vanilla speed behavior.
; Risk / note: Too high can worsen overshoot.
ChopperSpeedLimitRatio=3.2
; OnDrivingDecelSpeedScale
; Vanilla value: 0.85
; Current value: 0.82
; What it does: Deceleration scaling when the heli needs to slow down.
; Higher usually: Higher keeps more speed / slower decel.
; Lower usually: Lower slows the heli harder.
; Risk / note: Lower this if it overshoots and cannot slow down.
OnDrivingDecelSpeedScale=0.82
; OnDrivingTurnResponseScale
; Vanilla value: -8.0
; Current value: -22.0
; What it does: Turn response gain. More negative means stronger turning response.
; Higher usually: Sharper turning.
; Lower usually: Softer turning.
; Risk / note: Too aggressive can spin/orbit around the player.
OnDrivingTurnResponseScale=-22.0
; OnDrivingTurnClamp
; Vanilla value: 1.3
; Current value: 4.2
; What it does: Hard clamp for turn amount/rate. This is the big one that makes turning faster.
; Higher usually: Much faster turn-in.
; Lower usually: More vanilla/slow turn-in.
; Risk / note: If the heli circles or snaps too hard, lower this first.
OnDrivingTurnClamp=4.2
; LockOnDrivingSmoothingToVanilla
; Vanilla value: not in vanilla game / release safety default = 1
; Current value: 1
; What it does: Safety lock added by the ASI. Forces smoothing to stock values and prevents smoothing
;               patches.
; Higher usually: 1 keeps the known stable smoothing values.
; Lower usually: 0 allows smoothing patches if the DLL supports them.
; Risk / note: Keep ON. Changing smoothing caused spin/orbit bugs.
LockOnDrivingSmoothingToVanilla=1
; OnDrivingSmoothingOldWeight
; Vanilla value: 7.0
; Current value: 7.0
; What it does: Old-value weight used by OnDriving smoothing. Kept as documentation because the lock
;               preserves it.
; Higher usually: More old value / smoother but potentially laggier if patched.
; Lower usually: Less old value / snappier but unstable if patched.
; Risk / note: Do not change for release.
OnDrivingSmoothingOldWeight=7.0
; OnDrivingSmoothingFinalScale
; Vanilla value: 0.125
; Current value: 0.125
; What it does: Final smoothing scale. Kept as documentation because the lock preserves it.
; Higher usually: Higher can create stronger/snappier smoothing output if patched.
; Lower usually: Lower can dampen output if patched.
; Risk / note: Do not change for release.
OnDrivingSmoothingFinalScale=0.125

[Chopper::Exit]

; ---------------------------------------------------------------------------
; Fuel timeout / fly-away / exit behavior
; ---------------------------------------------------------------------------
; DisableFuelBasedHeliExit
; Vanilla value: 0
; Current value: 1
; What it does: Stops fuel/time-based logic from forcing the heli to leave the pursuit.
; Higher usually: 1 keeps heli around longer.
; Lower usually: 0 lets vanilla fuel timeout remove it.
; Risk / note: Recommended ON for aggressive pursuit mods.
DisableFuelBasedHeliExit=1
; EnableHeliExitActionPatches
; Vanilla value: 0
; Current value: 1
; What it does: Master switch for tuning fallback fly-away/exit action behavior.
; Higher usually: Exit tuning below can apply.
; Lower usually: Vanilla exit action behavior.
EnableHeliExitActionPatches=1
; PatchExitFlySpeed
; Vanilla value: 0
; Current value: 1
; What it does: Allows ExitFlySpeed to be patched.
; Higher usually: Uses the matching value below.
; Lower usually: Leaves that part vanilla.
PatchExitFlySpeed=1
; PatchExitSeekUpThreshold
; Vanilla value: 0
; Current value: 1
; What it does: Allows the vertical seek-up threshold to be patched.
; Higher usually: Uses the matching value below.
; Lower usually: Leaves that part vanilla.
PatchExitSeekUpThreshold=1
; PatchExitSeekAheadDistance
; Vanilla value: 0
; Current value: 1
; What it does: Allows the fly-away seek-ahead distance to be patched.
; Higher usually: Uses the matching value below.
; Lower usually: Leaves that part vanilla.
PatchExitSeekAheadDistance=1
; PatchExitSeekCarReachDistance
; Vanilla value: 0
; Current value: 1
; What it does: Allows the car reach distance check to be patched.
; Higher usually: Uses the matching value below.
; Lower usually: Leaves that part vanilla.
PatchExitSeekCarReachDistance=1
; PatchExitFlyoutBackScale
; Vanilla value: 0
; Current value: 1
; What it does: Allows flyout back-scale to be patched.
; Higher usually: Uses the matching value below.
; Lower usually: Leaves that part vanilla.
PatchExitFlyoutBackScale=1
; PatchExitFlyoutExtraHeight
; Vanilla value: 0
; Current value: 1
; What it does: Allows extra flyout height to be patched.
; Higher usually: Uses the matching value below.
; Lower usually: Leaves that part vanilla.
PatchExitFlyoutExtraHeight=1
; PatchExitFinishRules
; Vanilla value: 0
; Current value: 0
; What it does: Experimental finish-rule patch for the exit action.
; Higher usually: Can alter when the exit action finishes.
; Lower usually: Vanilla finish rules.
; Risk / note: Keep OFF for release.
PatchExitFinishRules=0
; PatchExitDoDrivingMode
; Vanilla value: 0
; Current value: 0
; What it does: Experimental patch for exit DoDriving mode.
; Higher usually: Changes exit driving mode behavior.
; Lower usually: Vanilla mode.
; Risk / note: Keep OFF for release.
PatchExitDoDrivingMode=0
; ExitFlySpeed
; Vanilla value: 120.0
; Current value: 175.0
; What it does: Fly speed used by exit/fly-away logic when patched.
; Higher usually: Faster fly-away/reposition if exit is forced.
; Lower usually: Slower exit movement.
; Risk / note: Only matters if exit action is active/patched.
ExitFlySpeed=175.0
; ExitSeekUpThreshold
; Vanilla value: 12.0
; Current value: 5.0
; What it does: Vertical threshold for seeking upward during exit/fly-away.
; Higher usually: Requires larger height condition.
; Lower usually: Triggers upward seek sooner.
ExitSeekUpThreshold=5.0
; ExitSeekAheadDistance
; Vanilla value: 70.0
; Current value: 35.0
; What it does: Forward seek distance during exit/fly-away.
; Higher usually: Flies farther forward during exit.
; Lower usually: Shorter exit seek path.
ExitSeekAheadDistance=35.0
; ExitSeekCarReachDistanceSq
; Vanilla value: 64.0
; Current value: 144.0
; What it does: Squared reach-distance check during exit action.
; Higher usually: Larger completion/reach radius.
; Lower usually: Smaller completion/reach radius.
ExitSeekCarReachDistanceSq=144.0
; ExitRightNegativeScale
; Vanilla value: -4.0
; Current value: -4.0
; What it does: Side vector scale used by exit pathing.
; Higher usually: More side/back bias if made more negative.
; Lower usually: Less side/back bias near zero.
; Risk / note: Usually leave vanilla.
ExitRightNegativeScale=-4.0
; ExitFlyoutBackScale
; Vanilla value: -120.0
; Current value: -40.0
; What it does: Back-scale used when flying out/leaving.
; Higher usually: More negative sends it farther back.
; Lower usually: Less negative keeps it closer.
ExitFlyoutBackScale=-40.0
; ExitFlyoutExtraHeight
; Vanilla value: 2.0
; Current value: 0.0
; What it does: Extra height added during flyout.
; Higher usually: Higher flyout.
; Lower usually: Lower flyout.
ExitFlyoutExtraHeight=0.0
; ExitFinishHeight
; Vanilla value: 25.0
; Current value: 25.0
; What it does: Height condition used by exit finish logic.
; Higher usually: Requires/uses higher finish height.
; Lower usually: Lower finish height.
ExitFinishHeight=25.0
; ExitFinishDistanceSq
; Vanilla value: 22500.0
; Current value: 22500.0
; What it does: Squared distance condition used by exit finish logic.
; Higher usually: Allows farther distance before finish.
; Lower usually: Requires closer distance before finish.
ExitFinishDistanceSq=22500.0
; ExitDoDrivingMode
; Vanilla value: 7
; Current value: 7
; What it does: Driving mode value used by exit action if patched.
; Higher usually: Different mode if supported.
; Lower usually: Different mode if supported.
; Risk / note: Leave at 7 unless you know the mode table.
ExitDoDrivingMode=7

[Chopper::HeliSheet]

; ---------------------------------------------------------------------------
; Terrain / safety sheet behavior
; ---------------------------------------------------------------------------
; EnableHeliSheetPatches
; Vanilla value: 0
; Current value: 0
; What it does: Enables patches that change how the heli obeys HeliSheet terrain/safety logic.
; Higher usually: Allows HeliSheet ignore/respect values to apply.
; Lower usually: Game uses vanilla HeliSheet behavior.
; Risk / note: Release preset keeps this OFF to avoid wall-dives.
EnableHeliSheetPatches=1
; ForceIgnoreHeliSheetInAllPursuitModes
; Vanilla value: 0
; Current value: 0
; What it does: Forces the heli to ignore HeliSheet safety/terrain rules in pursuit modes.
; Higher usually: More direct chase path; can solve idle/stuck cases.
; Lower usually: More vanilla safety around terrain/walls.
; Risk / note: Keep OFF for release. ON can cause low wall clipping/diving.
ForceIgnoreHeliSheetInAllPursuitModes=1
; RespectHeliSheetDuringSkid
; Vanilla value: 1
; Current value: 1
; What it does: Keeps HeliSheet respected during skid/attack phases.
; Higher usually: More terrain-safe attacks.
; Lower usually: More aggressive/cursed low attacks if disabled.
; Risk / note: Keep ON for release.
RespectHeliSheetDuringSkid=0

[Chopper::Speed]

; ---------------------------------------------------------------------------
; Live velocity regulator
; ---------------------------------------------------------------------------
; Enable
; Vanilla value: 0
; Current value: 1
; What it does: Enables the ASI velocity regulator that nudges heli rigidbody speed toward a target.
; Higher usually: Speed system active.
; Lower usually: Vanilla heli speed behavior.
; Risk / note: If weird physics happen, turn this OFF first.
Enable=1
; SpeedFactor
; Vanilla value: 1.0
; Current value: 1.28
; What it does: Multiplier applied to desired heli drive speed.
; Higher usually: Higher top chase target.
; Lower usually: Closer to vanilla or slower.
; Risk / note: Too high can overshoot or escape turns.
SpeedFactor=1.28
; MaxSpeed
; Vanilla value: 0.0
; Current value: 175.0
; What it does: Custom speed ceiling for the velocity regulator. 0 means no custom ceiling.
; Higher usually: Allows faster maximum speed.
; Lower usually: Caps the heli lower.
; Risk / note: Lower if it flies ahead too much.
MaxSpeed=175.0
; SpeedPush
; Vanilla value: 0.0
; Current value: 0.085
; What it does: How strongly the regulator pushes speed upward toward target.
; Higher usually: Faster catch-up / stronger acceleration.
; Lower usually: Softer speed correction.
; Risk / note: Too high causes rubberband/overshoot.
SpeedPush=0.085
; OverspeedBrake
; Vanilla value: 0.0
; Current value: 0.24
; What it does: How strongly the regulator reduces speed when above target.
; Higher usually: Brakes overspeed harder.
; Lower usually: Lets overspeed/momentum linger.
; Risk / note: Raise if it overshoots after turns.
OverspeedBrake=0.24
; MinApplySpeed
; Vanilla value: 0.0
; Current value: 12.0
; What it does: Minimum speed threshold/floor for applying speed regulation.
; Higher usually: Avoids tiny low-speed corrections.
; Lower usually: Regulator can affect lower speeds.
; Risk / note: Usually leave around 20.
MinApplySpeed=12.0
; TurnSlowdown
; Vanilla value: 0
; Current value: 1
; What it does: Reduces target speed during sharper turns.
; Higher usually: Keeps heli more stable in turns.
; Lower usually: No turn-based slowdown.
; Risk / note: Recommended ON with higher turn clamp.
TurnSlowdown=1
; TurnSlowdownStrength
; Vanilla value: 0.0
; Current value: 280.0
; What it does: Strength of the turn slowdown effect.
; Higher usually: Slows more during turns.
; Lower usually: Less slowdown; faster but more overshoot.
; Risk / note: Raise if it overshoots tight corners.
TurnSlowdownStrength=280.0
; IgnoreNegativeDesiredSpeed
; Vanilla value: 0
; Current value: 1
; What it does: Ignores negative desired-speed readings from the game so the regulator does not chase
;               nonsense values.
