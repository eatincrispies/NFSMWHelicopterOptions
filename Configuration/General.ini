[Helicopter:Acceleration]
; How much acceleration (in m/s per second) the helicopter has to reach the velocity it wants.
; It has minChopperAccel plus 0.6 x its own speed, but never more than maxChopperAccel.
;
; ■ FORMAT: heatXY = maxChopperAccel, minChopperAccel (FREE-ROAM; -> "default" if omitted)
;           raceXY = maxChopperAccel, minChopperAccel (RACES;     -> "heatXY"  if omitted)
;
; • "maxChopperAccel" is the most it can use. It must be between 40.0 and 250.0; the game's own value is 80.0.
; • "minChopperAccel" is the least it always has. It must be between 0.0 and 160.0 and can't be higher than
;   maxChopperAccel; the game's own value is 30.0.
; • While the heli sheet is ignored, the helicopter gets maxChopperAccel straight away.
; • In the game: Max_Chopper_Accel and Min_Chopper_Accel, the limits SimpleChopper accelerates with.
; • You can define a "default" value pair.

