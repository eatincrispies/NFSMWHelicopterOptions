[Helicopter:DespawnDistance]
; How far away (in metres) the helicopter must be before the game removes it from the pursuit and the minimap.
; The distance is measured to a point 75 m ahead of your car, in the direction you are driving.
;
; ■ FORMAT: heatXY = despawnDistance (FREE-ROAM; -> "default" if omitted)
;           raceXY = despawnDistance (RACES;     -> "heatXY"  if omitted)
;
; • Must be between 100.0 and 5000.0; the game's own value is 600.0 (ground units use 375.0).
; • The game also needs the helicopter to have been out for at least 8 s and to be outside the area where
;   it spawns new units; this only changes the distance.
; • In the game: AICopManager, compDist = bIsChopper ? 600.0 : 375.0.
; • You can define a "default" value.

