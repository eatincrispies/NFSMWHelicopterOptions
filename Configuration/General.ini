;
; The everyday helicopter settings: how long it stays, where it spawns, how far it sees, how fast it flies,
; attacks, searches and leaves. The finer AI and flight-model tuning is in Advanced.ini.


; ── ■ │ SPAWNING │ ■ ───────────────────────────────────────────────────────────────────────────
; Where the helicopter is placed when it joins a pursuit.

[Helicopter:SpawnDistance]
; How far away from you (in metres) the helicopter spawns.
;
; ■ FORMAT: heatXY = spawnDistance (FREE-ROAM; -> "default" if omitted)
;           raceXY = spawnDistance (RACES;     -> "heatXY"  if omitted)
;
; • Each value must be a decimal or whole number between 30.0 and 600.0.
; • The game's own value is 250.0.
; • In the game: AICopManager::SpawnPursuitHelicopter, testNav.IncNavPosition(250.0, ...).
; • You can define a "default" value.

