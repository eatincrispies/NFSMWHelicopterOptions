[Helicopter:AllAroundSight]
; How close (in metres) you must be for the helicopter to see you whichever way it is facing.
; Further out it only sees you in front of it, up to LineOfSight. Buildings and tunnels still block it.
;
; ■ FORMAT: heatXY = allAroundSight (FREE-ROAM; -> "default" if omitted)
;           raceXY = allAroundSight (RACES;     -> "heatXY"  if omitted)
;
; • Must be between 0.0 and 1000.0; the game's own value is 75.0.
; • Twice this distance is also how close it must be to keep you after a building blocks its view.
; • In the game: kHeliVisualSphere, which AIVehicleHelicopter::CanSeeTarget checks.
; • You can define a "default" value.

