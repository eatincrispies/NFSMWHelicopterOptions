; ── ■ │ ATTACKING │ ■ ──────────────────────────────────────────────────────────────────────────
; How the helicopter attacks your car.

[Helicopter:CrushAttack]
; Replaces the skid attack with one that comes down on top of your car.
; In the vanilla skid attack the helicopter pulls up 6 m beside your car and sweeps 3 m across it, about
; 0.4 m above its middle, so it mostly clips the side. With this, it flies in over your car at hoverHeight;
; once it is right above you it drops to crushHeight above the middle of your car and keeps pressing down.
; If you slip out from under it, it climbs back to hoverHeight and comes down again.
;
; ■ FORMAT: heatXY = hoverHeight, crushHeight (FREE-ROAM; -> "the game's own value" if omitted)
;           raceXY = hoverHeight, crushHeight (RACES;     -> "heatXY"               if omitted)
;
; • "hoverHeight" (in metres) must be between 0.0 and 10.0. 0 turns this off and keeps the vanilla skid attack.
; • "crushHeight" (in metres) must be between 0.0 and 6.0 and can't be higher than hoverHeight.
;   Lower presses down harder.
; • The attack still ends the game's way: 8 s after it starts (at least 2 s after the helicopter drops), or
;   once the helicopter is more than 12 m behind you or 40 m in front of you.
; • In the game: AIActionHeliPursuit::SkidHitPursuit (kSkid_Hit_Approach and kSkid_Hit_Strike), the drive target
;   it hands to SetDriveTarget. The game has no value for this, so there is no default.
; • You can't define a "default" value pair.

