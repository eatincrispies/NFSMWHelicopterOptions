; ── ■ │ SEARCHING │ ■ ──────────────────────────────────────────────────────────────────────────
; How the helicopter searches for you during cooldown.

[Helicopter:SearchSpeed]
; How fast the helicopter flies (in m/s) while it searches for you during cooldown.
;
; ■ FORMAT: heatXY = searchSpeedMin, searchSpeedMax (FREE-ROAM; -> "default" if omitted)
;           raceXY = searchSpeedMin, searchSpeedMax (RACES;     -> "heatXY"  if omitted)
;
; • Each leg of the search picks a speed between the two.
; • Each must be between 5.0 and 120.0, and searchSpeedMin can't be above searchSpeedMax.
; • The game's own search flies at 70.0; this mod's slow search uses 15.0 to 20.0.
; • In the game: AIActionHeliPursuit::SearchForPerp (replaced by this mod's search pattern).
; • You can define a "default" value pair.

