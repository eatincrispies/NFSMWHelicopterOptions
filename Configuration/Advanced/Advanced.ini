; ── ■ │ FLIGHT MODEL │ ■ ───────────────────────────────────────────────────────────────────────
; How the helicopter turns, accelerates and brakes.

[Helicopter:Turning]
; How hard the helicopter turns toward where it wants to go, and the hardest turn it is allowed to make.
;
; ■ FORMAT: heatXY = turnClamp, turnResponseScale (FREE-ROAM; -> "default" if omitted)
;           raceXY = turnClamp, turnResponseScale (RACES;     -> "heatXY"  if omitted)
;
; • "turnClamp" is the hardest turn allowed. It must be between 0.4 and 5.0; the game's own value is 1.3.
; • "turnResponseScale" is how hard it steers toward its target, more negative = sharper. It must be between
;   -30.0 and -0.5; the game's own value is -8.0.
; • Turning authority is turnResponseScale x turnClamp; past 175% of the game's the helicopter can flip.
; • In the game: SimpleChopper::OnTaskSimulate, angVel.y = -totalTorque.y * 8.0, clamped to -1.3 .. 1.3.
;   The game doesn't name either number; turnClamp and turnResponseScale are this mod's names.
; • You can define a "default" value pair.

