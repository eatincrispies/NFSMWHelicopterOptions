[Helicopter:Notification]
; The message the game shows when you take out a helicopter, like its own "Federal Undercover Vehicle / Combo Bounty" message for cop cars.
;
; ■ FORMAT: copheli = message (the same at every Heat level and in races)
;
; • ^ starts a new line, and %$d is replaced by the bounty you got for it, including the combo multiplier.
; • Only one %$d (or %d) can be used, and %% shows a percent sign. Anything else, and no message is shown.
; • The game shows at most 63 characters once the bounty is filled in.
; • Leave it empty or comment it out to show no message, as in the game.
; • In the game: PursuitBoard::SetNumCopsDestroyed has a message for every cop car, but none for copheli.

copheli = G-YPOL X-40 Police Helicopter^Combo Bounty: %$d
