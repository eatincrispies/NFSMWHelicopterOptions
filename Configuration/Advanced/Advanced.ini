; ── ■ │ CHASING │ ■ ────────────────────────────────────────────────────────────────────────────
; Where the helicopter aims while it chases you and how fast it closes in.

[Helicopter:Leading]
; How far ahead of your car (in metres) the helicopter aims while it chases you.
; The distance is your speed (m/s) x 0.4 + leadBase, but never more than leadMax. Once the helicopter is
; ready to attack, it aims at 75% of that.
;
; ■ FORMAT: heatXY = leadBase, leadMax (FREE-ROAM; -> "default" if omitted)
;           raceXY = leadBase, leadMax (RACES;     -> "heatXY"  if omitted)
;
; • "leadBase" is added to your speed x 0.4. It must be between 0.0 and 100.0; the game's own value is 30.0.
; • "leadMax" is the furthest ahead it aims. It must be between 5.0 and 150.0; the game's own value is 45.0.
; • On a curve the point ahead of you lies off the road, so a long lead pulls the helicopter off the road.
; • The game only starts an attack from in front of your car, so a very short lead means fewer attacks.
; • In the game: AIActionHeliPursuit::StraightLinePursuit, leadDist = mPlayerSpeed * 0.4 + 30.0, capped at 45.0.
; • You can define a "default" value pair.

