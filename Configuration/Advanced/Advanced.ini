; ── ■ │ HELI SHEET │ ■ ─────────────────────────────────────────────────────────────────────────
; The game's map of the lowest altitude the helicopter may fly at.

[Helicopter:HeliSheet]
; Whether the helicopter obeys the heli sheet, the game's map of the lowest altitude (y) it may fly at.
; In some parts of the map the sheet holds it so high, or pulls it up so hard, that it stalls and falls behind.
; With false the sheet is ignored everywhere, so the helicopter can clip through buildings.
;
; ■ FORMAT: heatXY = heliSheet (FREE-ROAM; -> "the game's own value" if omitted)
;           raceXY = heliSheet (RACES;     -> "heatXY"               if omitted)
;
; • While the sheet is ignored, the game also gives the helicopter its full acceleration (MaxChopperAccel).
; • Each value must be either "true" or "false".
; • The game always obeys the heli sheet: NeverIgnoreHeliSheet is true, so not even skid hits ignore it.
; • The mod lowers the sheet to 1 m above roads and other paved ground; buildings keep the full sheet.
; • The helicopter looks ahead along its way and climbs early for buildings, hills and tunnel mouths, so it doesn't fly into them.
; • In the game: bIgnoreHeliSheet, which AIVehicleHelicopter::OnDriving checks.
; • You can't define a "default" value.

heat01 = true
heat02 = true
heat03 = true
