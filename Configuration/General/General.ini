[Helicopter:LineOfSight]
; How far away (in metres) the helicopter can still see your car.
; Past this distance it counts as having lost sight of you even with nothing in the way, so it is
; part of what lets you slip into cooldown with the helicopter still around.
;
; ■ FORMAT: heatXY = lineOfSight (FREE-ROAM; -> "the game's own value" if omitted)
;           raceXY = lineOfSight (RACES;     -> "heatXY"               if omitted)
;
; • The game's own values come from VltEd (pursuitlevels heliLOSdistance): 251 at Heat 1-7 and 301 at Heat 8-10,
;   in races too. If VltEd has no value, the game falls back to 250.
; • 0 keeps whatever the game gives it.
; • Each value must be a decimal or whole number between 0.0 and 5000.0.
; • You can't define a "default" value.

