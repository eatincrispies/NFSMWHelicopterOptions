[Helicopter:Helicopters]
; How many helicopters can chase you at once.
; The game sends the first one; while fewer than this many are out, the mod sends another every 5 s.
; They spread out around you and take turns attacking.
;
; ■ FORMAT: heatXY = helicopters (FREE-ROAM; -> "default" if omitted)
;           raceXY = helicopters (RACES;     -> "heatXY"  if omitted)
;
; • Each value must be a whole number between 1 and 4.
; • The game's own value is 1.
