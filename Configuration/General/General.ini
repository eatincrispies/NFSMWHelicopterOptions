; ── ■ │ SPEED, SIGHT AND FUEL │ ■ ──────────────────────────────────────────────────────────────
; The helicopter's top speed, how far it can see and how long its fuel lasts.

[Helicopter:SpeedCap]
; Top speed (in m/s) of the helicopter: chopperspecs MAX_SPEED_MPS, which the game sets to 100 (360 km/h).
; The game never lets the helicopter fly faster than this, climbing included, so a higher cap lets it
; keep up when you drive faster than about 70 m/s and stops climbs from slowing it down.
;
; ■ FORMAT: heatXY = speedCap (FREE-ROAM; -> "default" if omitted)
;           raceXY = speedCap (RACES;     -> "heatXY"  if omitted)
;
; • The speed the helicopter asks for stays the game's: your speed + 30 m/s while chasing, 100 m/s during
;   a skid attack and 70 m/s while searching.
; • [Helicopter:FlySpeed] can't go above this value.
; • Each value must be a decimal or whole number between 30.0 and 500.0.
; • The game's own value is 100.0.
; • You can define a "default" value.

default = 100.0

heat01 = 100.0
heat02 = 100.0
heat03 = 105.0
heat04 = 110.0
heat05 = 115.0
heat06 = 120.0
heat07 = 125.0
heat08 = 130.0
heat09 = 140.0
heat10 = 150.0

race01 = 100.0
race02 = 100.0
race03 = 105.0
race04 = 110.0
race05 = 115.0
race06 = 120.0
race07 = 125.0
race08 = 130.0
race09 = 140.0
