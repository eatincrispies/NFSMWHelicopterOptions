[Helicopter:Recycle]
; How long (in seconds) a destroyed helicopter's wreck stays, and how far away from it (in metres) you must be, before the game removes it.
;
; ■ FORMAT: heatXY = recycleTime, recycleDistance (FREE-ROAM; -> "default" if omitted)
;           raceXY = recycleTime, recycleDistance (RACES;     -> "heatXY"  if omitted)
;
; • The wreck is removed once it has been down for recycleTime seconds and you are at least recycleDistance away from it.
; • recycleTime must be between 0.0 and 300.0, and recycleDistance between 0.0 and 2000.0.
; • A recycleTime of 0 keeps the game's own rule: the wreck can vanish the moment it goes down if you are far from it, otherwise it goes once it has been off screen for 3 seconds.
; • The game doesn't send the next helicopter until the wreck is gone, so long times and distances hold it back.
; • In the game: AICopManager::UpdatePatrols, a destroyed cop is removed when CanRespawn and (RespawnAvailable or GetOffscreenTime > 3.0).
; • You can define a "default" value pair.

