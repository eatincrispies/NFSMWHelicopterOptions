[Helicopter:IgnoreHeliSheetDistance]
; How far away from you (in metres) the helicopter must be before it ignores the heli sheet.
; It then flies straight back toward you, and obeys the sheet again once it is within 80% of this distance.
;
; ■ FORMAT: heatXY = ignoreHeliSheetDistance (FREE-ROAM; -> "the game's own value" if omitted)
;           raceXY = ignoreHeliSheetDistance (RACES;     -> "heatXY"               if omitted)
;
; • Distance is measured along the ground, so altitude (y) doesn't count toward it.
; • About 200 m keeps any clipping out of sight. It still holds its chase height above you while it flies back.
; • 0 turns this off. It has no effect while HeliSheet is false, because the sheet is already ignored.
; • Each value must be a decimal or whole number between 0.0 and 2000.0.
; • In the game: bIgnoreHeliSheet again, switched by distance. The game has no value for this.
; • You can't define a "default" value.

