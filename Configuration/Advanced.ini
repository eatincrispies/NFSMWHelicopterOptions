[Helicopter:Brake]
; How the helicopter brakes as it nears where it is flying to.
;
; ■ FORMAT: heatXY = stoppingRatio, brakeSpeedScale (FREE-ROAM; -> "default" if omitted)
;           raceXY = stoppingRatio, brakeSpeedScale (RACES;     -> "heatXY"  if omitted)
;
; • "stoppingRatio": 0.3 to 10.0; the game's own value is 1.55. Lower brakes earlier and softer.
; • "brakeSpeedScale": 0.0 to 1.0; the game's own value is 0.4. Lower slows it down harder.
; • In the game: AIVehicleHelicopter::OnDriving (stopping distance = closing speed² / (1.55 x deceleration),
;   then mDriveSpeed x 0.4).
; • You can define a "default" value pair.

