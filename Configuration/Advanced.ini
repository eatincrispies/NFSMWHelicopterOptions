[Helicopter:ClosingSpeed]
; How fast the helicopter closes in on the point it chases (in m/s), by how far away that point is.
;
; ■ FORMAT: heatXY = nearSpeed, midSpeed, farSpeed (FREE-ROAM; -> "default" if omitted)
;           raceXY = nearSpeed, midSpeed, farSpeed (RACES;     -> "heatXY"  if omitted)
;
; • "nearSpeed" is used 3-15 m away; the game's own value is 20.0.
; • "midSpeed" is used 15-300 m away; the game's own value is 30.0.
; • "farSpeed" is used more than 300 m away; the game's own value is 50.0.
; • Each must be between 0.0 and 200.0. Your own speed is added on top.
; • In the game: AIActionHeliPursuit::StraightLinePursuit, desiredClosingSpeed.
; • You can define a "default" values.

