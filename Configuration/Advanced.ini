; ── ■ │ SEARCHING │ ■ ──────────────────────────────────────────────────────────────────────────
; How wide the helicopter circles while it searches for you during cooldown.

[Helicopter:SearchRadius]
; How far from where it last saw you (in metres) the helicopter circles while it searches.
;
; ■ FORMAT: heatXY = searchRadiusFirst, searchRadiusLargest (FREE-ROAM; -> "default" if omitted)
;           raceXY = searchRadiusFirst, searchRadiusLargest (RACES;     -> "heatXY"  if omitted)
;
; • The first circle uses searchRadiusFirst; each next point is 40 m further out, up to searchRadiusLargest.
; • searchRadiusFirst must be between 20.0 and 1000.0, searchRadiusLargest between 20.0 and 2000.0.
; • searchRadiusFirst can't be above searchRadiusLargest.
; • In the game: AIActionHeliPursuit::SetNextPerpSearchDest (replaced by this mod's search pattern).
; • You can define a "default" value pair.

